name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1
          pip install -e "server[dev,llm]"
          python -m playwright install --with-deps chromium
      - name: Schema in sync
        run: python scripts/gen_schema.py --check
      - name: Browser engine self-test (Node)
        run: node tests/js/run_selftest.js
      - name: Server tests + browser/server parity
        run: cd server && python -m pytest -q
      - name: End-to-end (Chromium, fake microphone)
        run: python -m pytest -q tests/e2e
      - name: Build single-file web app
        run: python scripts/build_web.py
      - uses: actions/upload-artifact@v4
        with: { name: voice-enhancer-html, path: dist/voice-enhancer.html }
